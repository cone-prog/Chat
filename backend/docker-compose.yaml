networks:
  default:
    name: "chat"

volumes:
  chat-pg:
  chat-logs:
  chat-prom:
  chat-graf:

services:
  postgres:
    container_name: "chat-db"
    image: "postgres:18"
    ports: 
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: 5258
      POSTGRES_USER: "postgres"
      POSTGRES_DB: "chat"
    volumes: 
      - chat-pg:/var/lib/postgresql
  
  prometheus:
    container_name: 'chat-prom'
    image: 'prom/prometheus'
    restart: unless-stopped
    ports:
      - '9090:9090'
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yml
      - chat-prom:/prometheus
  
  loki:
    container_name: 'chat-loki'
    image: grafana/loki:3.7.0
    ports:
      - '3100:3100'
    volumes:
      - ./loki-config.yaml:/mnt/config/loki-config.yaml 
    command: --config.file=/mnt/config/loki-config.yaml
  
  grafana:
    container_name: 'chat-graf'
    image: 'grafana/grafana'
    restart: unless-stopped
    environment:
      GF_PLUGINS_PREINSTALL: 'grafana-clock-panel'
    ports:
      - '3000:3000'
    volumes:
      - chat-graf:/var/lib/grafana
    depends_on:
      - prometheus
      
  jaeger:
    container_name: 'chat-jaeger'
    image: "cr.jaegertracing.io/jaegertracing/jaeger:2.20.0"
    ports:
      - '16686:16686' 
      - '4317:4317' 
      - '4318:4318'
      - '5778:5778'
      - '9411:9411'
  
  api:
    build:
      context: .
    container_name: 'chat-api'
    ports:
      - '8080:8080'
    environment:
      ConnectionStrings__Tracing: 'http://chat-jaeger:4317'
      ConnectionStrings__PgConnection: 'Host=chat-db;Port=5432;Database=chat;Username=postgres;Password=5258'
      ConnectionStrings__Logs: 'http://chat-loki:3100'
    
    