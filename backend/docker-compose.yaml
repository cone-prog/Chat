networks:
  default:
    name: "chat"

volumes:
  chat-pg:
  chat-logs:

services:
  postgres:
    container_name: "chat-db"
    image: "postgres:18"
    ports: 
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: 5258
      POSTGRES_USER: "postgres"
      POSTGRES_DB: "chat"
    volumes: 
      - chat-pg:/var/lib/postgresql
  
  opensearch:
    container_name: "chat-os"
    image: "opensearchproject/opensearch:3"
    ports:
      - "9200:9200"
      - "9600:9600"
    environment:
      discovery.type: "single-node"
      DISABLE_SECURITY_PLUGIN: "true"
    volumes:
      - chat-logs:/usr/share/opensearch/data
    
  opensearch-dashboards:
    container_name: 'chat-osd'
    image: 'opensearchproject/opensearch-dashboards:3'
    ports:
      - '5601:5601'
    environment:
      OPENSEARCH_HOSTS: '["http://chat-os:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: 'true'
    depends_on:
      - opensearch
