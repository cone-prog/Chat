networks:
  default:
    name: "chat"

volumes:
  chat-pg:
  chat-logs:
  chat-prom:
  chat-graf:

services:
  postgres:
    container_name: "chat-db"
    image: "postgres:18"
    ports: 
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: 5258
      POSTGRES_USER: "postgres"
      POSTGRES_DB: "chat"
    volumes: 
      - chat-pg:/var/lib/postgresql
  
  opensearch:
    container_name: "chat-os"
    image: "opensearchproject/opensearch:3"
    ports:
      - "9200:9200"
      - "9600:9600"
    environment:
      discovery.type: "single-node"
      DISABLE_SECURITY_PLUGIN: "true"
    volumes:
      - chat-logs:/usr/share/opensearch/data
    
  opensearch-dashboards:
    container_name: 'chat-osd'
    image: 'opensearchproject/opensearch-dashboards:3'
    ports:
      - '5601:5601'
    environment:
      OPENSEARCH_HOSTS: '["http://chat-os:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: 'true'
    depends_on:
      - opensearch
  
  prometheus:
    container_name: 'chat-prom'
    image: 'prom/prometheus'
    restart: unless-stopped
    ports:
      - '9090:9090'
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yml
      - chat-prom:/prometheus
  
  grafana:
    container_name: 'chat-graf'
    image: 'grafana/grafana'
    restart: unless-stopped
    environment:
      GF_PLUGINS_PREINSTALL: 'grafana-clock-panel'
    ports:
      - '3000:3000'
    volumes:
      - chat-graf:/var/lib/grafana
    depends_on:
      - prometheus
      
  jaeger:
    container_name: 'chat-jaeger'
    image: "cr.jaegertracing.io/jaegertracing/jaeger:2.22.0"
    ports:
      - '16686:16686' 
      - '4317:4317' 
      - '4318:4318'
      - '5778:5778'
      - '9411:9411'
     
    
    